services:
  postgres:
    image: postgres:16
    container_name: restaurant_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - restaurant_data:/var/lib/postgresql/data

volumes:
  restaurant_data:
